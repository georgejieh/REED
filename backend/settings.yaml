# REED operator settings.
#
# `python cli_setup.py` regenerates this file from the provider keys in
# your `.env`. The values below are the local-first defaults: the
# in-process scheduler owns the schedule and no external cron is needed.
#
# Secrets never belong in this file. They come from `.env` locally, or
# from the host's secrets UI when deployed.
#
# Deploying to a sleeping host such as a free Hugging Face Space needs
# `scheduler.enabled: false` plus an external cron. See
# docs/HF_DEPLOYMENT.md.

provider: openrouter
model: google/gemini-2.5-flash
base_url:
sessions:
  enabled:
    - pre_market
    - early_market
    - midday
    - close
    - weekend_recap
market_data:
  provider: stooq
data_dir: ./data/digests
scheduler:
  enabled: true
  timezone: US/Eastern
  skip_holidays: true
trigger:
  enabled: false
