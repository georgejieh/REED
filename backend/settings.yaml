# REED operator settings, written for the HF Space deployment.
# The Space secrets UI provides: OPENROUTER_API_KEY, REED_TRIGGER_TOKEN,
# HF_TOKEN, and HF_DATASET_REPO. Do not commit real secrets here.
# News context is fetched from public RSS endpoints (no API keys needed).

provider: openrouter
model: google/gemini-2.5-flash
base_url:
sessions:
  enabled:
    - pre_market
    - early_market
    - midday
    - close
    - weekend_recap
tools:
  per_session_max_scrapes: 2
market_data:
  provider: stooq
data_dir: ./data/digests
scheduler:
  enabled: false
  timezone: US/Eastern
  skip_holidays: true
trigger:
  enabled: true
