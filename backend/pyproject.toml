[project]
name = "reed"
version = "0.1.0"
description = "A constrained market digest runtime."
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "keyring>=25.7.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]
