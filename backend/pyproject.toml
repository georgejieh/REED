[project]
name = "reed"
version = "0.1.0"
description = "A constrained market digest runtime."
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "keyring>=25.7.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pytest>=8.3",
    "ruff==0.12.9",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
