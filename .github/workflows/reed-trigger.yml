name: REED trigger

on:
  # Source of truth: backend/app/news/rss.py exact ET windows.
  # Each schedule entry uses GitHub Actions timezone-aware cron with
  # America/New_York local values. Unknown schedules fail the run.
  schedule:
    - cron: "0 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "45 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "30 12 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 16 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 7 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      session:
        description: "Session to trigger"
        required: true
        type: choice
        options:
          - pre_market
          - early_market
          - midday
          - close
          - weekend_recap

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger REED session
        env:
          REED_TOKEN: ${{ secrets.REED_TOKEN }}
        run: |
          if [ -n "${{ inputs.session }}" ]; then
            SESSION="${{ inputs.session }}"
          else
            case "${{ github.event.schedule }}" in
              "0 8 * * 1-5") SESSION="pre_market" ;;
              "45 9 * * 1-5") SESSION="early_market" ;;
              "30 12 * * 1-5") SESSION="midday" ;;
              "15 16 * * 1-5") SESSION="close" ;;
              "0 7 * * 1") SESSION="weekend_recap" ;;
              *) echo "ERROR: unknown schedule: ${{ github.event.schedule }}"; exit 1 ;;
            esac
          fi
          echo "Triggering session: $SESSION at $(date -u)"
          curl -fsS -X POST \
            -H "X-REED-Token: ${REED_TOKEN}" \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            -o /tmp/reed_resp.json -w "\nHTTP:%{http_code}\n" \
            "https://coldashsage-reed.hf.space/api/trigger/${SESSION}"
          # Reject stub responses so cron does not silently succeed on failure.
          if [ -f /tmp/reed_resp.json ]; then
            if grep -qE '"fallback_used": ?true|"headline": ?"\[[^]]*STUB' /tmp/reed_resp.json; then
              echo "ERROR: REED trigger returned stub or fallback brief"
              exit 2
            fi
          fi
